<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentis 🧠 - Onboarding</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { font-family: Inter, Arial, sans-serif; background: #F9FAFB; margin:0; padding:20px; color:#111827; }
  .container { max-width: 500px; margin: auto; display:flex; flex-direction:column; gap:20px; }
  h1 { font-size:2rem; text-align:center; margin-bottom:20px; color:#1F4E79; }
  .progress-bar { height: 8px; background:#E5E7EB; border-radius:4px; overflow:hidden; margin-bottom:20px; }
  .progress-bar-inner { height:100%; width:0%; background:#2CB1BC; transition: width 0.3s ease; }
  .step { display:flex; flex-direction:column; gap:12px; }
  input, select { padding:10px; font-size:16px; border-radius:6px; border:1px solid #ccc; width:100%; }
  button { padding:12px; font-size:16px; border-radius:8px; border:none; background:#1F4E79; color:white; cursor:pointer; }
  button:hover { background:#163B60; }
</style>
</head>
<body>
<div class="container">
  <h1>Welcome to Mentis 🧠</h1>
  <div class="progress-bar"><div class="progress-bar-inner" id="progress"></div></div>
  <div id="step-container" class="step"></div>
  <button id="next-btn">Continue</button>
</div>

<script>
const steps = [
  { question: "Which country are you in?", type: "text", key: "country" },
  { question: "Which curriculum?", type: "text", key: "curriculum" },
  { question: "What is your goal?", type: "text", key: "goal" },
  { question: "Which subject?", type: "text", key: "subject" },
  { question: "How long until your deadline?", type: "text", key: "deadline" }
];

let currentStep = 0;
const answers = JSON.parse(localStorage.getItem("mentisOnboarding") || "{}");

function renderStep() {
  const container = document.getElementById("step-container");
  container.innerHTML = "";
  const step = steps[currentStep];
  const label = document.createElement("label");
  label.textContent = step.question;
  let input;
  if(step.type==="text") input = document.createElement("input");
  else if(step.type==="select") input = document.createElement("select");
  input.id = "answer";
  input.value = answers[step.key] || "";
  container.appendChild(label);
  container.appendChild(input);

  const progress = document.getElementById("progress");
  progress.style.width = `${((currentStep)/steps.length)*100}%`;
}

document.getElementById("next-btn").addEventListener("click", ()=>{
  const step = steps[currentStep];
  const val = document.getElementById("answer").value;
  if(val.trim()==="") return alert("Please enter a value");
  answers[step.key]=val;
  localStorage.setItem("mentisOnboarding", JSON.stringify(answers));
  currentStep++;
  if(currentStep>=steps.length){
    window.location.href="/index.html";
    return;
  }
  renderStep();
});

renderStep();
</script>
</body>
                              </html>
