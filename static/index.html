<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Mentis 🧠</title>

<!-- MathJax -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$']],
      displayMath: [['$$', '$$']]
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<style>
/* =========================
   MENTIS ANSWER FORMATTING START
========================= */
#answer {
  font-size: 16px;
  line-height: 1.7;
  padding: 12px;
  word-wrap: break-word;
  overflow-wrap: break-word;
  overflow-x: auto; /* Allows horizontal scroll for long equations */
}

/* Paragraph spacing */
#answer p {
  margin-bottom: 14px;
}

/* Bullet & numbered lists */
#answer ul,
#answer ol {
  margin: 12px 0 16px 20px;
  padding-left: 16px;
}

#answer li {
  margin-bottom: 8px;
}

/* Equations – mobile-safe */
#answer mjx-container {
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
}
/* =========================
   MENTIS ANSWER FORMATTING END
========================= */
.muted {
  color: var(--muted);
  font-size: 0.9rem;
}
</style>
</head>

<body>
<div class="app">

  <header>
    <h1>Mentis 🧠</h1>
    <div class="toggle" onclick="toggleDark()">🌒</div>
  </header>

  <div class="card">
    <div class="muted">Ask Mentis</div>
    <textarea id="question" placeholder="What is photosynthesis?"></textarea>
    <button onclick="askMentis()">Ask Mentis</button>
  </div>

  <div class="card">
    <div id="answer" class="muted">Your answer will appear here.</div>
  </div>

</div>

<script>
function toggleDark() {
  document.body.classList.toggle("dark");
}

async function askMentis() {
  const q = document.getElementById("question").value.trim();
  if (!q) return;

  const res = await fetch("/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: q })
  });

  const data = await res.json();
  const out = document.getElementById("answer");

  if (data.error) {
    out.innerText = "Error: " + data.error;
    return;
  }

  out.innerHTML = data.answer;
  MathJax.typesetPromise();
}
</script>

</body>
  </html>
