<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentis</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 720px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #020617;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
    }

    .toggle {
      cursor: pointer;
      font-size: 1.2rem;
    }
  </style>
</head>

<body>
  <!-- Mentis renders EVERYTHING here -->
  <div class="app"></div>

  <!-- Mentis logic -->
  <script type="module" src="/static/lessons.js"></script>
</body>
  </html>
