<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mentis Test</title>

  <!-- MathJax ONLY -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 20px;
      background: #f9fafb;
    }
    button {
      padding: 10px;
      margin-top: 10px;
    }
    #answer {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h1>Mentis (TEST)</h1>

  <input id="question" placeholder="Ask something…" style="width:100%;padding:10px;" />
  <button onclick="ask()">Ask</button>

  <div id="answer">Waiting…</div>

  <script>
    async function ask() {
      const q = document.getElementById("question").value;
      const res = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ question: q })
      });

      const data = await res.json();
      document.getElementById("answer").innerHTML = data.answer || data.error;
      MathJax.typesetPromise();
    }
  </script>
</body>
  </html>
