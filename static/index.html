<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mentis 🧠</title>

<!-- MathJax -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<!-- Markdown -->
<script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>

<link rel="stylesheet" href="styles.css" />
</head>

<body>
<header class="top-bar">
  <h1>Mentis 🧠</h1>
  <button id="themeToggle" aria-label="Toggle dark mode">🌒</button>
</header>

<main class="container">
  <section class="card">
    <label for="question" class="label">Ask Mentis</label>
    <textarea id="question" placeholder="What is photosynthesis?" rows="3"></textarea>
    <button class="primary" onclick="askMentis()">Ask Mentis</button>
  </section>

  <section id="answerCard" class="card hidden">
    <div id="output"></div>
  </section>
</main>

<script src="render.js"></script>

<script>
async function askMentis() {
  const q = document.getElementById("question").value.trim();
  if (!q) return;

  const res = await fetch("/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: q })
  });

  const data = await res.json();
  const card = document.getElementById("answerCard");
  const out = document.getElementById("output");

  card.classList.remove("hidden");
  out.innerHTML = data.error ? data.error : renderAnswer(data.answer);

  MathJax.typesetPromise();
}

document.getElementById("themeToggle").onclick = () => {
  document.body.classList.toggle("dark");
};
</script>
</body>
  </html>
