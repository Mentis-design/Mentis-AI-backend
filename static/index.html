<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mentis 🧠</title>

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="app">
    <header class="topbar">
      <h1>Mentis 🧠</h1>
      <button id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    </header>

    <section class="input-area">
      <input id="question" placeholder="Ask Mentis anything…" />
      <button id="askBtn">Ask Mentis</button>
    </section>

    <section id="answer" class="card"></section>
  </main>

  <script src="render.js"></script>
