<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mentis 🧠</title>

<!-- MathJax -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$']],
      displayMath: [['$$', '$$']]
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<style>
/* ---------- COLOR SYSTEM ---------- */
:root {
  --bg: #F9FAFB;
  --card: #FFFFFF;
  --primary: #1F4E79;
  --accent: #2CB1BC;
  --highlight: #F5B700;
  --text: #111827;
  --muted: #6B7280;
  --border: #E5E7EB;
}

body.dark {
  --bg: #0F172A;
  --card: #1E293B;
  --primary: #2CB1BC;
  --accent: #38BDF8;
  --highlight: #F5B700;
  --text: #E5E7EB;
  --muted: #9CA3AF;
  --border: #334155;
}

/* ---------- BASE ---------- */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

/* ---------- LAYOUT ---------- */
.app {
  width: 100%;
  max-width: 720px;
  padding: 24px 16px 40px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

h1 {
  font-size: 1.8rem;
  font-weight: 700;
  margin: 0;
  color: var(--primary);
}

/* ---------- TOGGLE ---------- */
.toggle {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 1rem;
}

/* ---------- INPUT ---------- */
.input-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 20px;
}

input {
  width: 100%;
  font-size: 1rem;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  outline: none;
}

button.ask {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  font-size: 1rem;
  border-radius: 10px;
  border: none;
  background: var(--primary);
  color: white;
  cursor: pointer;
}

button.ask:active {
  opacity: 0.9;
}

/* ---------- ANSWER ---------- */
.answer {
  background: var(--card);
  border-radius: 16px;
  padding: 20px;
  line-height: 1.7;
  border: 1px solid var(--border);
  font-size: 1rem;
}

.answer p {
  margin-bottom: 1em;
}

mjx-container {
  overflow-x: auto;
}
</style>
</head>

<body>
<div class="app">
  <header>
    <h1>Mentis 🧠</h1>
    <button class="toggle" onclick="toggleDark()">🌙</button>
  </header>

  <div class="input-box">
    <input id="question" placeholder="Ask Mentis anything…" />
    <button class="ask" onclick="askMentis()">Ask Mentis</button>
  </div>

  <div id="answer" class="answer"></div>
</div>

<script>
function toggleDark() {
  document.body.classList.toggle("dark");
}

async function askMentis() {
  const q = document.getElementById("question").value.trim();
  if (!q) return;

  const res = await fetch("/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: q })
  });

  const data = await res.json();
  document.getElementById("answer").innerHTML =
    data.error ? data.error : data.answer;

  MathJax.typesetPromise();
}
</script>
</body>
  </html>
