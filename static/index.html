<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentis</title>

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --accent: #38bdf8;
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.app {
  max-width: 720px;
  margin: auto;
  padding: 16px;
}

.card {
  background: var(--card);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: var(--accent);
  color: #020617;
  font-size: 1rem;
  cursor: pointer;
}

.progress {
  height: 8px;
  background: #334155;
  border-radius: 10px;
  overflow: hidden;
  margin: 8px 0;
}

.progress-fill {
  height: 100%;
  width: 30%;
  background: var(--accent);
}

.hidden {
  display: none;
}

.option {
  padding: 12px;
  border-radius: 10px;
  background: #334155;
  margin-bottom: 10px;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="app">

<!-- LEARN SCREEN -->
<div id="learn-screen" class="card">

  <div class="progress">
    <div class="progress-fill" id="learn-progress"></div>
  </div>

  <button onclick="startLesson()">Resume Lesson</button>
</div>

<!-- LESSON SCREEN -->
<div id="lesson-screen" class="card hidden">
  <p>Question <span id="q-num">1</span> of 12</p>

  <h3 id="question">Solve: 2x + 5 = 13</h3>

  <div class="option" onclick="submit()">A) x = 3</div>
  <div class="option" onclick="submit()">B) x = 4</div>
  <div class="option" onclick="submit()">C) x = 6</div>
  <div class="option" onclick="submit()">D) x = 8</div>

  <button onclick="nextQuestion()">Next</button>
</div>

</div>

<script type="module" src="/static/lessons.js"></script>

</body>
  </html>
