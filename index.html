<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentis</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e5e7eb;
      --accent: #38bdf8;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 720px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #020617;
      font-size: 1rem;
      cursor: pointer;
    }
    /* ---- OPTIONS (MCQ CARDS) ---- */
.option {
  background: #334155;
  border-radius: 16px;
  padding: 14px 16px;
  margin: 10px 0;
  cursor: pointer;
  transition: all 0.25s ease;
}

.option:hover {
  background: #475569;
  transform: translateY(-2px);
}

.option.correct {
  background: #22c55e;
  color: #022c22;
}

.option.wrong {
  background: #ef4444;
  color: #450a0a;
}

/* ---- QUESTION ANIMATION ---- */
.fade {
  animation: fadeIn 0.35s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ---- PROGRESS BAR ---- */
.progress {
  height: 8px;
  background: #334155;
  border-radius: 999px;
  overflow: hidden;
  margin: 10px 0 18px;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.3s ease;
}

#feedback {
  margin-top: 12px;
  font-weight: bold;
}

#next-btn {
  margin-top: 14px;
  }
  </style>
</head>
<body>

  <!-- This is where lessons.js will render content -->
  <div class="app"></div>

  <!-- Load lessons.js -->
  <script type="module" src="/static/lessons.js"></script>
</body>
  </html>
