<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentis</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e5e7eb;
      --accent: #38bdf8;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 720px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #020617;
      font-size: 1rem;
      cursor: pointer;
    }
    /* ---- OPTIONS (MCQ CARDS) ---- */
.option {
  background: #334155;
  border-radius: 16px;
  padding: 14px 16px;
  margin: 10px 0;
  cursor: pointer;
  transition: all 0.25s ease;
}

.option:hover {
  background: #475569;
  transform: translateY(-2px);
}

.option.correct {
  background: #22c55e;
  color: #022c22;
}

.option.wrong {
  background: #ef4444;
  color: #450a0a;
}

/* ---- QUESTION ANIMATION ---- */
.fade {
  animation: fadeIn 0.35s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ---- PROGRESS BAR ---- */
.progress {
  height: 8px;
  background: #334155;
  border-radius: 999px;
  overflow: hidden;
  margin: 10px 0 18px;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.3s ease;
}

#feedback {
  margin-top: 12px;
  font-weight: bold;
}

#next-btn {
  margin-top: 14px;
  }
  /* ---------------- NEW LESSON STYLING ---------------- */

/* Multiple choice options as curved rectangles */
.option {
  padding: 14px 18px;
  margin: 10px 0;
  border-radius: 12px;
  background: #334155;
  color: var(--text);
  cursor: pointer;
  transition: background 0.3s, transform 0.2s;
  font-size: 1rem;
}

.option:hover {
  background: var(--accent);
  color: #020617;
  transform: scale(1.03);
}

/* Correct / wrong feedback coloring */
.option.correct {
  background: #22c55e; /* green */
  color: #020617;
}

.option.wrong {
  background: #ef4444; /* red */
  color: #ffffff;
}

/* Fade-in animation for questions */
.question-container {
  opacity: 0;
  animation: fadeIn 0.5s forwards;
}

@keyframes fadeIn {
  to {
    opacity: 1;
  }
}

/* Progress bar */
.progress {
  height: 10px;
  background: #334155;
  border-radius: 10px;
  margin: 12px 0;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.3s ease;
}

/* Question number indicator */
.question-number {
  margin: 8px 0;
  font-weight: bold;
  color: var(--accent);
  font-size: 0.95rem;
}

/* Lesson completion screen */
.lesson-complete {
  text-align: center;
  padding: 20px;
}

.lesson-complete h2 {
  margin-bottom: 16px;
  color: var(--accent);
}

.lesson-complete p {
  font-size: 1rem;
  margin-bottom: 12px;
  }
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e5e7eb;
    --accent: #38bdf8;
    --correct: #22c55e;
    --wrong: #ef4444;
  }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    position: relative;
  }

  .app {
    max-width: 720px;
    margin: auto;
    padding: 16px;
  }

  header h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }

  button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #020617;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }

  button:hover {
    transform: translateY(-2px);
  }

  /* Mode buttons */
  .mode-btn {
    flex: 1;
    padding: 12px;
    font-size: 0.9rem;
    border-radius: 12px;
  }

  .mode-btn + .mode-btn {
    margin-left: 10px;
  }

  /* Options buttons (multiple choice) */
  .option-btn {
    border-radius: 20px;
    padding: 12px;
    margin: 10px 0;
    font-size: 1rem;
    transition: transform 0.1s, background 0.2s;
  }

  .option-btn:hover {
    transform: translateY(-2px);
  }

  .options-container {
    display: flex;
    flex-direction: column;
  }

  /* Progress bar */
  .progress {
    width: 100%;
    height: 10px;
    background: #334155;
    border-radius: 5px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0;
    border-radius: 5px;
    transition: width 0.4s ease;
  }

  .q-num {
    margin-bottom: 8px;
    font-weight: bold;
  }

  .question {
    font-size: 1.2rem;
    margin-bottom: 12px;
  }

  /* Timer */
  .timer {
    position: absolute;
    top: 16px;
    right: 16px;
    background: var(--card);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 0.9rem;
  }

  /* Flash correct answer in timed mode */
  .flash-answer {
    animation: flash 0.8s ease forwards;
    z-index: 10;
  }

  @keyframes flash {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  /* Completion screen */
  .completion-title {
    font-size: 1.8rem;
    text-align: center;
    margin-bottom: 20px;
  }
  </style>
</head>
<body>

  <!-- This is where lessons.js will render content -->
  <div class="app"></div>

  <!-- Load lessons.js -->
  <script type="module" src="/static/lessons.js"></script>
</body>
  </html>
